<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UserVault — CRUD App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">UserVault</span>
      </div>
      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>
      <div id="authError" class="auth-error hidden"></div>
      <div class="auth-form" id="loginForm">
        <div class="field-group">
          <label>Username</label>
          <input id="loginUsername" type="text" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="field-group">
          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <button class="primary-btn full-width" onclick="doLogin()">
          <span>Sign In</span>
        </button>
      </div>
      <div class="auth-form hidden" id="registerForm">
        <div class="field-group">
          <label>Username</label>
          <input id="regUsername" type="text" placeholder="Choose a username">
        </div>
        <div class="field-group">
          <label>Password <small>(min 6 chars)</small></label>
          <input id="regPassword" type="password" placeholder="Choose a password">
        </div>
        <button class="primary-btn full-width" onclick="doRegister()">
          <span>Create Account</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="app-screen hidden">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">UserVault</span>
      </div>
      <div class="header-right">
        <span class="user-badge" id="loggedInAs"></span>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>
    </header>

    <div class="app-body">

      <!-- STATS DASHBOARD -->
      <section class="stats-section">
        <div class="stat-card" id="statTotal">
          <div class="stat-icon">👥</div>
          <div class="stat-info">
            <div class="stat-value" id="statTotalVal">–</div>
            <div class="stat-label">Total Users</div>
          </div>
        </div>
        <div class="stat-card" id="statAvgAge">
          <div class="stat-icon">📊</div>
          <div class="stat-info">
            <div class="stat-value" id="statAvgAgeVal">–</div>
            <div class="stat-label">Average Age</div>
          </div>
        </div>
        <div class="stat-card" id="statNewest">
          <div class="stat-icon">🆕</div>
          <div class="stat-info">
            <div class="stat-value" id="statNewestVal">–</div>
            <div class="stat-label">Newest User</div>
          </div>
        </div>
        <div class="stat-card" id="statOldest">
          <div class="stat-icon">📅</div>
          <div class="stat-info">
            <div class="stat-value" id="statOldestVal">–</div>
            <div class="stat-label">First User</div>
          </div>
        </div>
      </section>

      <!-- ADD USER FORM -->
      <section class="form-section">
        <h2 class="section-title">Add New User</h2>
        <div class="add-form">
          <div class="field-group">
            <label>Full Name <span class="req">*</span></label>
            <input id="name" type="text" placeholder="e.g. Jane Smith">
            <span class="field-error" id="err-name"></span>
          </div>
          <div class="field-group">
            <label>Email Address <span class="req">*</span></label>
            <input id="email" type="email" placeholder="e.g. jane@example.com">
            <span class="field-error" id="err-email"></span>
          </div>
          <div class="field-group">
            <label>Age <span class="req">*</span></label>
            <input id="age" type="number" placeholder="e.g. 28" min="1" max="120">
            <span class="field-error" id="err-age"></span>
          </div>
          <button class="primary-btn add-submit-btn" onclick="addUser()">
            + Add User
          </button>
        </div>
        <div id="formMessage" class="form-message hidden"></div>
      </section>

      <!-- USERS LIST -->
      <section class="list-section">
        <div class="list-header">
          <h2 class="section-title">All Users</h2>
          <div id="listStatus" class="list-status"></div>
        </div>
        <div id="usersContainer" class="users-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading users…</span>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-icon">🗑️</div>
      <h3>Delete User?</h3>
      <p id="confirmText">This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeConfirm()">Cancel</button>
        <button class="danger-btn" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
