services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/cruddb
      - JWT_SECRET=change_this_to_a_strong_random_secret

  mongo:
    image: mongo
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: